
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d19">
<title>Secure Access</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 20% 20%, #334c80 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #45316f 0%, transparent 50%),
        linear-gradient(135deg, #080d19, #11182c);
}

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    pointer-events: none;
    animation: float 8s infinite alternate ease-in-out;
}

.glow.one {
    background: #529cff;
    top: -80px;
    left: -70px;
}

.glow.two {
    background: #a66bff;
    bottom: -100px;
    right: -60px;
    animation-delay: -4s;
}

@keyframes float {
    to { transform: translate(60px, 50px) scale(1.2); }
}

.panel {
    position: relative;
    width: min(90%, 370px);
    padding: 38px 28px;
    border-radius: 35px;
    text-align: center;

    background: rgba(255,255,255,.085);
    border: 1px solid rgba(255,255,255,.2);

    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);

    box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        inset 0 1px 1px rgba(255,255,255,.25);

    animation: appear .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.lock {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    font-size: 30px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: inset 0 1px 10px rgba(255,255,255,.1);
}

h1 {
    font-size: 25px;
    margin: 0;
    font-weight: 650;
    letter-spacing: -.6px;
}

.subtitle {
    color: #aebbd2;
    font-size: 13px;
    margin: 10px 0 28px;
}

.dots {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 13px;
}

.dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.35);
    transition: .2s;
}

.dot.filled {
    background: white;
    box-shadow: 0 0 13px rgba(255,255,255,.65);
    transform: scale(1.12);
}

#status {
    height: 20px;
    font-size: 12px;
    color: #aebbd2;
    margin-bottom: 20px;
}

#status.error {
    color: #ff8585;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    height: 62px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.09);
    color: white;
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: inset 0 1px rgba(255,255,255,.1);
    transition: transform .15s, background .15s;
}

.key:active {
    transform: scale(.92);
    background: rgba(255,255,255,.25);
}

.key.special {
    font-size: 14px;
    color: #c3d4ee;
}

.footer {
    font-size: 10px;
    color: rgba(255,255,255,.4);
    margin-top: 25px;
    letter-spacing: 1px;
}

.shake {
    animation: shake .35s;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-9px); }
    50% { transform: translateX(9px); }
    75% { transform: translateX(-5px); }
}

.success {
    animation: success .6s forwards;
}

@keyframes success {
    to {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(10px);
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<main class="panel" id="panel">

    <div class="lock">🔒</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Enter your access password to continue.</p>

    <div class="dots" id="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <div id="status">Enter your 6-digit password</div>

    <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>

        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>

        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>

        <button class="key special" onclick="clearAll()">CLEAR</button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key special" onclick="backspace()">⌫</button>
    </div>

    <div class="footer">SECURE ACCESS SYSTEM</div>
</main>

<script>
const PASSWORD = "198273";
const DESTINATION = "mainGame.html";

let entered = "";
let locked = false;

const dots = document.querySelectorAll(".dot");
const statusText = document.getElementById("status");
const panel = document.getElementById("panel");

function updateDisplay() {
    dots.forEach((dot, index) => {
        dot.classList.toggle("filled", index < entered.length);
    });
}

function press(number) {
    if (locked || entered.length >= 6) return;

    entered += number;
    updateDisplay();

    if (entered.length === 6) {
        setTimeout(checkPassword, 180);
    }
}

function backspace() {
    if (locked) return;
    entered = entered.slice(0, -1);
    statusText.textContent = "Enter your 6-digit password";
    statusText.className = "";
    updateDisplay();
}

function clearAll() {
    if (locked) return;
    entered = "";
    statusText.textContent = "Enter your 6-digit password";
    statusText.className = "";
    updateDisplay();
}

function checkPassword() {
    if (entered === PASSWORD) {
        locked = true;
        statusText.textContent = "Access granted! Welcome.";
        statusText.style.color = "#80ffba";

        panel.classList.add("success");

        setTimeout(() => {
            window.location.href = DESTINATION;
        }, 650);

    } else {
        statusText.textContent = "Incorrect password. Try again.";
        statusText.className = "error";

        panel.classList.add("shake");

        setTimeout(() => {
            panel.classList.remove("shake");
            entered = "";
            updateDisplay();
        }, 450);
    }
}

// Physical keyboard support
document.addEventListener("keydown", event => {
    if (/^[0-9]$/.test(event.key)) {
        press(event.key);
    } else if (event.key === "Backspace") {
        backspace();
    } else if (event.key === "Escape") {
        clearAll();
    }
});
</script>

</body>
</html>
